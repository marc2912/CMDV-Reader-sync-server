name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The platform this actually ships on. Run first and on its own, because a developer working on
  # a Mac never exercises it and the failures that only happen here — Foundation's date formatting
  # among them — are exactly the ones that reach a user's container.
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-noble
    strategy:
      fail-fast: false
      matrix:
        # 6.1 is the floor, because Hummingbird's manifest declares swift-tools-version 6.1.
        # A newer one alongside it, so a toolchain bump is not a surprise on the day it happens.
        swift: ["6.1", "6.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  # Builds the image the same way anyone checking this repository out would, and then actually
  # starts it and talks to it. A Dockerfile that builds but produces a container which exits
  # immediately would otherwise pass.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cmdv-sync-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and register a device
        run: |
          set -euo pipefail
          docker run -d --name sync -p 8080:8080 \
            -e CMDV_SYNC_DATABASE=/data/cmdv-sync.sqlite \
            cmdv-sync-server:ci

          # Wait on the health check the image declares, rather than on a fixed sleep.
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' sync)"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && { docker logs sync; exit 1; }
            sleep 1
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' sync)" = "healthy" ]

          curl -fsS http://127.0.0.1:8080/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'

          # The one endpoint that proves the whole stack works: it writes to SQLite on the volume
          # and derives a key, so a missing libsqlite3 or a broken swift-crypto shows up here.
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/devices \
            -H 'Content-Type: application/json' \
            -H 'X-CMDV-Sync-Version: 1' \
            -d '{"username":"ci","password":"a good password","deviceName":"CI","deviceID":"11111111-1111-1111-1111-111111111111"}' \
            | tee /dev/stderr | grep -q '"token"'

          # Runs unprivileged, which is only worth asserting because it is easy to regress.
          [ "$(docker exec sync id -u)" = "1001" ]

      - name: Stop it gracefully
        run: |
          set -euo pipefail
          # SIGTERM has to be enough. If it is not, `docker stop` takes the full timeout and then
          # kills the process, which is how in-flight syncs get severed in production.
          start=$(date +%s)
          docker stop --timeout 15 sync
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          [ "$elapsed" -lt 10 ]
          docker logs sync

  # Not a failure when the app is absent, which on a runner it always is. Present so that a change
  # to the wire format made in this repository rather than in the app is visible in a pull request
  # instead of being discovered by a client that cannot sync.
  protocol-parity:
    name: Protocol parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          Scripts/check-protocol-parity.sh || status=$?
          # 2 means "no app checkout to compare against", which is expected here. 1 is drift.
          [ "${status:-0}" != "1" ]
