name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for a dry run"
        required: true
        default: "v0.0.0-test"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26"

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve version
        id: version
        run: echo "value=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Six artefacts from one machine, in one step, because the SQLite driver is pure Go and cgo is
      # off. This is the reason the whole distribution story costs a few lines rather than a second
      # build system.
      - name: Cross-compile
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          mkdir -p dist

          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="cmdv-sync-server_${version}_${os}_${arch}"
            binary="cmdv-sync-server"
            [ "$os" = "windows" ] && binary="cmdv-sync-server.exe"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=${version}" \
                -o "dist/${binary}" ./cmd/cmdv-sync-server

            # LICENSE and the protocol spec travel with every binary: the spec is what makes an
            # alternative implementation possible, so it should not require finding the repository.
            cp LICENSE README.md dist/
            cp -r spec dist/

            if [ "$os" = "windows" ]; then
              (cd dist && zip -qr "../${name}.zip" "$binary" LICENSE README.md spec)
            else
              (cd dist && tar -czf "../${name}.tar.gz" "$binary" LICENSE README.md spec)
            fi
            rm -rf "dist/${binary}" dist/LICENSE dist/README.md dist/spec
            echo "built ${name}"
          done

          # Checksums, so somebody downloading a binary from a release page can verify it.
          sha256sum cmdv-sync-server_* > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            cmdv-sync-server_*
            checksums.txt

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            cmdv-sync-server_* checksums.txt

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 for a VPS, arm64 for the Raspberry Pi and Apple Silicon cases this is likely to
          # actually run on.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
